# Приёмник отзывов на зарубежном зеркале (194.5.65.182). Своего сервиса здесь нет:
# запрос уходит на прод, где стоит единственный экземпляр и единственный токен.
# Без этой локации кнопка «написать» у зарубежных игроков и игроков под VPN отвечает 404:
# гео-DNS приводит их на зеркало, а эндпоинт был только на vdsina.
# Подключается в vhost pozerkalam.space строкой
#   include snippets/pozerkalam-feedback.conf;
location = /api/feedback {
    # add_header внутри location отключает ВСЕ add_header уровня server, поэтому
    # заголовки безопасности подключаются здесь заново.
    include snippets/pozerkalam-headers.conf;

    client_max_body_size 1m;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;
    if ($request_method = OPTIONS) { return 204; }

    proxy_pass https://83.217.215.66/api/feedback;
    proxy_set_header Host pozerkalam.space;
    proxy_ssl_server_name on;
    # Прод считает и limit_req, и лимит сервиса по этому адресу. Без него весь мир
    # приходит с одного IP зеркала и делит одну квоту в 6 отчётов в минуту.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 25s;
}
