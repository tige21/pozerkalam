# Аналитика на зарубежном зеркале (194.5.65.182). Своего Rybbit здесь нет: запрос уходит на
# прод, а оттуда в инстанс spark. Без этой локации игроки под VPN и из-за рубежа выпадают из
# аналитики целиком — гео-DNS приводит их сюда, а /rb/ был бы 404.
# Подключается в vhost pozerkalam.space строкой
#   include snippets/pozerkalam-rybbit.conf;
location /rb/ {
    include snippets/pozerkalam-headers.conf;

    client_max_body_size 64k;

    proxy_pass https://83.217.215.66/rb/;
    proxy_set_header Host pozerkalam.space;
    proxy_ssl_server_name on;
    # Прод доверяет этому заголовку только от адреса зеркала и передаёт его Rybbit — по нему
    # считается страна игрока.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
}
