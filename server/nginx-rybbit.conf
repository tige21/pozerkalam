# Аналитика игры: Rybbit spark на этом же боксе (127.0.0.1:3001, дашборд
# analytics.sparkcards.space, сайт pozerkalam). Скрипт берёт адрес отправки из своего src
# (src.split("/script.js")[0]), поэтому тег /rb/script.js шлёт события на /rb/track — на
# свой домен: это 'self' в CSP, и игроки под VPN, которых гео-DNS уводит на зеркало,
# доходят до аналитики через его прокси (analytics.* резолвится только в РФ-бокс).
# Подключается в vhost pozerkalam.space строкой
#   include snippets/pozerkalam-rybbit.conf;
location /rb/ {
    # add_header внутри location отключает ВСЕ add_header уровня server — заголовки
    # безопасности подключаются здесь заново.
    include snippets/pozerkalam-headers.conf;

    # Зарубежные игроки приходят через зеркало 194.5.65.182. Rybbit за nginx берёт страну по
    # X-Real-IP (resolveClientIp: X-Real-IP → X-Forwarded-For → сокет); без доверия зеркалу
    # весь мир был бы одним немецким посетителем.
    set_real_ip_from 194.5.65.182;
    real_ip_header X-Real-IP;

    # Повтор сессии выключен, событие весит сотни байт.
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host analytics.sparkcards.space;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
}
