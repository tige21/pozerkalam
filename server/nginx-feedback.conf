# Приёмник отзывов. Подключается в vhost pozerkalam.space строкой
#   include snippets/pozerkalam-feedback.conf;
# Зона fb объявлена в /etc/nginx/conf.d/pozerkalam-limits.conf (http-контекст).
location = /api/feedback {
    # add_header внутри location отключает ВСЕ add_header уровня server, поэтому
    # заголовки безопасности подключаются здесь заново. Убрать эту строку — снять
    # CSP и nosniff со всего эндпоинта.
    include snippets/pozerkalam-headers.conf;

    limit_req zone=fb burst=3 nodelay;
    client_max_body_size 1m;

    # Билд Яндекс Игр и старое зеркало 194.5.65.182 шлют сюда с чужого origin.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;
    if ($request_method = OPTIONS) { return 204; }

    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 25s;
}
