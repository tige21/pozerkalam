# Сервис аккаунтов. Подключается в vhost pozerkalam.space строкой
#   include snippets/pozerkalam-account.conf;
# Зона acct объявлена в /etc/nginx/conf.d/pozerkalam-limits.conf (http-контекст).
# CORS нет намеренно: вход работает только со своего домена — в билде ЯИ и на старом
# зеркале по IP интерфейса входа нет.
location /api/v1/ {
    # add_header внутри location отключает ВСЕ add_header уровня server — заголовки
    # безопасности подключаются здесь заново. Страница callback живёт под этим же CSP.
    include snippets/pozerkalam-headers.conf;

    # Игроки под VPN и из-за рубежа приходят через зеркало 194.5.65.182: доверяем его X-Real-IP,
    # иначе лимиты сервиса считали бы весь мир одним клиентом.
    set_real_ip_from 194.5.65.182;
    real_ip_header X-Real-IP;

    # грубый барьер от флуда; поллинг входа — раз в 2 с, точные лимиты считает сам сервис
    limit_req zone=acct burst=20 nodelay;
    client_max_body_size 128k;

    proxy_pass http://127.0.0.1:8788/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 25s;
}
