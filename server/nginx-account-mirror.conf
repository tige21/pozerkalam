# Сервис аккаунтов на зарубежном зеркале (194.5.65.182). Своего сервиса и базы здесь нет:
# запрос уходит на прод — аккаунт один, с какого бы бокса игрок ни пришёл. Вход возвращает
# браузер на https://pozerkalam.space/api/v1/auth/callback, и для VPN-игрока это адрес зеркала.
# Подключается в vhost pozerkalam.space строкой
#   include snippets/pozerkalam-account.conf;
location /api/v1/ {
    include snippets/pozerkalam-headers.conf;

    client_max_body_size 128k;

    proxy_pass https://83.217.215.66/api/v1/;
    proxy_set_header Host pozerkalam.space;
    proxy_ssl_server_name on;
    # прод доверяет этому заголовку только от адреса зеркала
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 25s;
}
